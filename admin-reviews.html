<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Modération des avis - StreamLoaders</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M13 2L4.5 13.5H11L10.5 22L19.5 10.5H13L13 2Z' fill='url(%23g0)'/%3E%3Cdefs%3E%3ClinearGradient id='g0' x1='4.5' y1='2' x2='19.5' y2='22' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23C4A5FF'/%3E%3Cstop offset='1' stop-color='%237B5FF5'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/legal-shared.css">

  <style>
    /* ─── Admin-specific ──────────────────────────────────────────── */
    .admin-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    @media (max-width: 640px) {
      .admin-shell {
        padding: 24px 16px 56px;
      }
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }

    .admin-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .admin-logo svg {
      width: 24px;
      height: 24px;
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .admin-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* Token box */
    .token-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .token-box input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--r-md);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .token-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Buttons */
    .btn-primary,
    .btn-ghost,
    .btn-approve,
    .btn-reject {
      height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: var(--r-md);
      font-size: 14.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s, background .15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover:not(:disabled) {
      opacity: .86;
    }

    .btn-ghost {
      height: 38px;
      padding: 0 14px;
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border-2);
      font-size: 13.5px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-2);
      color: var(--text);
    }

    .btn-approve {
      background: var(--success);
      color: #fff;
      flex: 1;
    }

    .btn-approve:hover:not(:disabled) {
      opacity: .88;
    }

    .btn-reject {
      background: var(--error);
      color: #fff;
      flex: 1;
    }

    .btn-reject:hover:not(:disabled) {
      opacity: .88;
    }

    button:disabled {
      opacity: .5 !important;
      cursor: not-allowed !important;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .toolbar small {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    /* Status */
    .status {
      font-size: 13.5px;
      margin-bottom: 16px;
      min-height: 20px;
      color: var(--text-dim);
      transition: color .15s;
    }

    .status.err {
      color: var(--error);
    }

    .status.ok {
      color: var(--success);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      padding: 16px 18px;
      margin-bottom: 10px;
      transition: box-shadow .15s;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .stars {
      font-size: 15px;
      letter-spacing: 2px;
      color: #F59E0B;
      margin-bottom: 6px;
    }

    .comment {
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment.empty-comment {
      color: var(--text-muted);
      font-style: italic;
    }

    .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-family: var(--font-mono);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 56px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="admin-shell">
    <div class="admin-header">
      <a href="/" class="admin-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M13 2L4.5 13.5H11L10.5 22L19.5 10.5H13L13 2Z" fill="url(#g0)" />
          <defs>
            <linearGradient id="g0" x1="4.5" y1="2" x2="19.5" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#C4A5FF" />
              <stop offset="1" stop-color="#7B5FF5" />
            </linearGradient>
          </defs>
        </svg>
        <span>StreamLoaders</span>
      </a>
      <button class="nav-icon-btn" id="themeBtn" title="Thème" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </div>

    <h1 class="admin-title">Modération des avis</h1>
    <p class="admin-sub">Page privée — ne pas partager ce lien.</p>

    <div class="token-box" id="tokenBox">
      <input type="password" id="tokenInput" placeholder="Jeton admin (ADMIN_TOKEN)" autocomplete="off">
      <button class="btn-primary" id="connectBtn">Connexion</button>
    </div>

    <div class="toolbar hidden" id="toolbar">
      <small id="countLabel"></small>
      <div class="toolbar-actions">
        <button class="btn-ghost" id="refreshBtn" type="button">↻ Rafraîchir</button>
        <button class="btn-ghost" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div id="list"></div>
  </div>

  <script src="./assets/legal-shared.js"></script>

  <script type="module">
    import { ENDPOINTS } from './scripts/config.js';

    const TOKEN_KEY = 'sl_admin_token';
    const $ = (id) => document.getElementById(id);

    const tokenBox = $('tokenBox');
    const toolbar = $('toolbar');
    const tokenInput = $('tokenInput');
    const connectBtn = $('connectBtn');
    const refreshBtn = $('refreshBtn');
    const logoutBtn = $('logoutBtn');
    const countLabel = $('countLabel');
    const statusEl = $('status');
    const listEl = $('list');

    const getToken = () => sessionStorage.getItem(TOKEN_KEY) || '';

    function setStatus(msg, kind = '') {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function starString(n) {
      const rating = Math.max(0, Math.min(5, Number(n) || 0));
      return '★'.repeat(rating) + '☆'.repeat(5 - rating);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const s = String(iso).includes('T') ? iso : String(iso).replace(' ', 'T') + 'Z';
      const d = new Date(s);
      return isNaN(d) ? String(iso) : d.toLocaleString('fr-FR');
    }

    function showConnectedState(connected) {
      tokenBox.classList.toggle('hidden', connected);
      toolbar.classList.toggle('hidden', !connected);
    }

    async function loadPending() {
      const token = getToken();
      if (!token) {
        showConnectedState(false);
        setStatus('Entre le jeton admin pour voir les avis en attente.');
        return;
      }

      showConnectedState(true);
      setStatus('Chargement…');
      listEl.innerHTML = '';

      let res;
      try {
        res = await fetch(ENDPOINTS.reviewsPending, {
          headers: { 'X-Admin-Token': token },
        });
      } catch {
        setStatus('Erreur réseau.', 'err');
        return;
      }

      if (res.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        showConnectedState(false);
        setStatus('Jeton invalide.', 'err');
        return;
      }

      if (!res.ok) {
        setStatus(`Erreur serveur (${res.status}).`, 'err');
        return;
      }

      const data = await res.json().catch(() => ({}));
      const reviews = Array.isArray(data.reviews) ? data.reviews : [];
      setStatus('');
      renderList(reviews);
    }

    function renderList(reviews) {
      countLabel.textContent = reviews.length ? `${reviews.length} avis en attente` : '';

      if (reviews.length === 0) {
        listEl.innerHTML = '<div class="empty">Aucun avis en attente.</div>';
        return;
      }

      listEl.innerHTML = reviews.map((r) => {
        const commentHtml = r.comment
          ? `<div class="comment">${escapeHtml(r.comment)}</div>`
          : `<div class="comment empty-comment">(pas de commentaire)</div>`;

        return `
          <div class="card" data-id="${escapeHtml(r.id)}">
            <div class="stars">${starString(r.rating)}</div>
            ${commentHtml}
            <div class="meta">${escapeHtml(formatDate(r.created_at))}</div>
            <div class="actions">
              <button class="btn-approve" data-action="approve" data-id="${escapeHtml(r.id)}">✓ Approuver</button>
              <button class="btn-reject"  data-action="reject"  data-id="${escapeHtml(r.id)}">✕ Rejeter</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function moderate(id, action) {
      const token = getToken();
      if (!token) return;

      const card = listEl.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);
      const buttons = card ? card.querySelectorAll('button') : [];
      buttons.forEach((b) => (b.disabled = true));

      let res;
      try {
        res = await fetch(ENDPOINTS.reviews(id, action), {
          method: 'POST',
          headers: { 'X-Admin-Token': token },
        });
      } catch {
        setStatus('Erreur réseau.', 'err');
        buttons.forEach((b) => (b.disabled = false));
        return;
      }

      if (res.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        showConnectedState(false);
        setStatus('Jeton invalide.', 'err');
        return;
      }
      if (!res.ok) {
        setStatus('Erreur lors de la modération.', 'err');
        buttons.forEach((b) => (b.disabled = false));
        return;
      }

      card?.remove();
      const remaining = listEl.querySelectorAll('.card').length;
      countLabel.textContent = remaining ? `${remaining} avis en attente` : '';
      if (remaining === 0) {
        listEl.innerHTML = '<div class="empty">Aucun avis en attente.</div>';
      }
      setStatus(action === 'approve' ? 'Avis approuvé.' : 'Avis rejeté.', 'ok');
      setTimeout(() => setStatus(''), 2500);
    }

    /* ─── Événements ─────────────────────────────────────────────── */

    connectBtn.addEventListener('click', () => {
      const val = tokenInput.value.trim();
      if (!val) return;
      sessionStorage.setItem(TOKEN_KEY, val);
      tokenInput.value = '';
      loadPending();
    });

    tokenInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') connectBtn.click();
    });

    refreshBtn.addEventListener('click', loadPending);

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(TOKEN_KEY);
      showConnectedState(false);
      setStatus('');
      listEl.innerHTML = '';
      countLabel.textContent = '';
      tokenInput.focus();
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      moderate(btn.dataset.id, btn.dataset.action);
    });

    /* ─── Init ───────────────────────────────────────────────────── */

    if (getToken()) {
      loadPending();
    } else {
      showConnectedState(false);
      tokenInput.focus();
    }
  </script>
</body>

</html>
