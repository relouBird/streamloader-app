name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: streamloader-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 5022 }}
          script_stop: true
          script: |
            set -e

            CHECKOUT_DIR="$HOME/.streamloader-web"
            PUBLIC_DIR="$HOME/public_html"
            REPOSITORY="https://github.com/relouBird/streamloader-app.git"
            BRANCH="main"
            DEPLOY_LOCK="$HOME/.streamloaders-deploy.lock"

            if [ ! -d "$PUBLIC_DIR" ]; then
              echo "ERROR: Public directory not found: $PUBLIC_DIR"
              exit 1
            fi

            if [ ! -d "$CHECKOUT_DIR/.git" ]; then
              echo "ERROR: Website is not initialized. Run the first-deployment workflow first."
              exit 1
            fi

            if ! ( set -o noclobber; mkdir "$DEPLOY_LOCK" ) 2>/dev/null; then
              echo "ERROR: Another deployment is already running."
              exit 1
            fi
            trap 'rmdir "$DEPLOY_LOCK"' EXIT

            command -v rsync >/dev/null 2>&1 || {
              echo "ERROR: rsync is required on the server."
              exit 1
            }

            cd "$CHECKOUT_DIR"
            CURRENT_SHA="$(git rev-parse HEAD)"
            git fetch --prune origin "$BRANCH"
            TARGET_SHA="$(git rev-parse "origin/$BRANCH")"

            if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
              echo "Already deployed: $TARGET_SHA"
              exit 0
            fi

            echo "Changes between $CURRENT_SHA and $TARGET_SHA:"
            git diff --name-status "$CURRENT_SHA" "$TARGET_SHA"

            git reset --hard "$TARGET_SHA"
            git clean -fd

            # Remove artifacts from older deployments before synchronizing the public tree.
            rm -rf -- \
              "$PUBLIC_DIR/_build" \
              "$PUBLIC_DIR/README.md" \
              "$PUBLIC_DIR/readme.md" \
              "$PUBLIC_DIR/read-api.md" \
              "$PUBLIC_DIR/read-migration.md"

            # Keep server-side configuration and hosting files, while never publishing
            # documentation, build sources, Git metadata, or CI configuration.
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.htaccess' \
              --exclude='.well-known/' \
              --exclude='_build/' \
              --exclude='*.md' \
              --exclude='README.md' \
              --exclude='readme.md' \
              --exclude='read-api.md' \
              --exclude='read-migration.md' \
              "$CHECKOUT_DIR/" "$PUBLIC_DIR/"

            echo "Deployment successful: $TARGET_SHA"
