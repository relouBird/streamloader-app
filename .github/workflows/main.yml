name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: streamloader-website-production
  cancel-in-progress: false

jobs:
  # 1) Génère les pages et vérifie la cohérence SEO AVANT tout déploiement.
  build:
    name: Generate and validate pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate platform pages
        run: node _build/build-pages.js

      # Le serveur déploie ce qui est commité : si le générateur produit un résultat
      # différent des pages commitées, le déploiement est bloqué.
      - name: Check generated pages are committed
        run: |
          if [ -n "$(git status --porcelain -- telecharger/)" ]; then
            echo "ERROR: les pages de telecharger/ ne sont pas à jour."
            echo "Lance 'node _build/build-pages.js' en local, puis commit les fichiers générés."
            git status --short -- telecharger/
            exit 1
          fi

      - name: Validate sitemap
        run: |
          set -euo pipefail
          BASE="https://streamloaders.net"

          if grep -E '<loc>[^<]*(index\.html|//www\.)' sitemap.xml; then
            echo "ERROR: le sitemap contient une URL index.html ou www."
            exit 1
          fi

          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | while read -r url; do
            case "$url" in
              "$BASE"*) ;;
              *) echo "ERROR: URL hors domaine canonique: $url"; exit 1 ;;
            esac
            path="${url#"$BASE"}"
            case "$path" in
              */) file=".${path}index.html" ;;
              *)  file=".${path}" ;;
            esac
            if [ ! -f "$file" ]; then
              echo "ERROR: $url -> fichier manquant ($file)"
              exit 1
            fi
          done

      - name: Validate canonical tags
        run: |
          set -euo pipefail
          for f in index.html telecharger/*/index.html; do
            [ -f "$f" ] || continue
            n=$(grep -c 'rel="canonical"' "$f" || true)
            if [ "$n" != "1" ]; then
              echo "ERROR: $f contient $n balise(s) canonical (1 attendue)"
              exit 1
            fi
            if ! grep 'rel="canonical"' "$f" | grep -q 'https://streamloaders.net'; then
              echo "ERROR: canonical hors domaine canonique dans $f"
              exit 1
            fi
          done

  # 2) Déploiement sur le serveur.
  deploy:
    name: Deploy static website
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 5022 }}
          script_stop: true
          script: |
            set -e

            CHECKOUT_DIR="$HOME/.streamloader-web"
            PUBLIC_DIR="$HOME/public_html"
            BRANCH="main"
            DEPLOY_LOCK="$HOME/.streamloaders-deploy.lock"

            if [ ! -d "$PUBLIC_DIR" ]; then
              echo "ERROR: Public directory not found: $PUBLIC_DIR"
              exit 1
            fi

            if [ ! -d "$CHECKOUT_DIR/.git" ]; then
              echo "ERROR: Website is not initialized. Run the first-deployment workflow first."
              exit 1
            fi

            if ! mkdir "$DEPLOY_LOCK" 2>/dev/null; then
              echo "ERROR: Another deployment is already running."
              exit 1
            fi
            trap 'rmdir "$DEPLOY_LOCK"' EXIT

            command -v rsync >/dev/null 2>&1 || {
              echo "ERROR: rsync is required on the server."
              exit 1
            }

            cd "$CHECKOUT_DIR"
            CURRENT_SHA="$(git rev-parse HEAD)"
            git fetch --prune origin "$BRANCH"
            TARGET_SHA="$(git rev-parse "origin/$BRANCH")"

            if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
              echo "Already deployed: $TARGET_SHA"
              exit 0
            fi

            echo "Changes between $CURRENT_SHA and $TARGET_SHA:"
            git diff --name-status "$CURRENT_SHA" "$TARGET_SHA"

            git reset --hard "$TARGET_SHA"
            git clean -fd

            # Remove artifacts from older deployments (excluded files are protected
            # from rsync --delete, so they must be removed explicitly).
            rm -rf -- "$PUBLIC_DIR/_build"
            find "$PUBLIC_DIR" -maxdepth 1 -type f -name '*.md' -delete

            # Keep server-side configuration and hosting files, while never publishing
            # documentation, build sources, Git metadata, or CI configuration.
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.htaccess' \
              --exclude='.well-known/' \
              --exclude='cgi-bin/' \
              --exclude='error_log' \
              --exclude='_build/' \
              --exclude='*.md' \
              "$CHECKOUT_DIR/" "$PUBLIC_DIR/"

            echo "Deployment successful: $TARGET_SHA"

  # 3) Contrôles HTTP après déploiement.
  # continue-on-error: ne bloque pas tant que les redirections ne sont pas en place
  # dans le .htaccess du serveur. Supprime cette ligne une fois la migration terminée.
  verify:
    name: Verify HTTP behaviour
    needs: deploy
    runs-on: ubuntu-latest
    # continue-on-error: true

    steps:
      - name: Check redirects and status codes
        run: |
          fail=0
          expect() {
            url="$1"; want="$2"; target="${3:-}"
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$url")
            code="${out%% *}"; loc="${out#* }"
            if [ "$code" != "$want" ] || { [ -n "$target" ] && [ "$loc" != "$target" ]; }; then
              echo "FAIL $url -> $out (attendu: $want $target)"; fail=1
            else
              echo "OK   $url -> $code"
            fi
          }

          B="https://streamloaders.net"
          expect "$B/" 200
          expect "https://www.streamloaders.net/" 301 "$B/"
          expect "$B/index.html" 301 "$B/"
          expect "$B/telecharger/youtube" 301 "$B/telecharger/youtube/"
          expect "$B/telecharger/youtube/" 200
          expect "$B/telecharger/youtube/index.html" 301 "$B/telecharger/youtube/"
          expect "$B/telecharger/inconnue/" 404
          exit $fail