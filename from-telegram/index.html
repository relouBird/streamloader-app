<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamLoaders — Offre Telegram</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="telegram-offer-page">
    <main class="telegram-offer-shell">
        <a class="telegram-offer-brand" href="/" aria-label="Retour à StreamLoaders">
            <img src="/icons/icon-192.png" alt="" width="42" height="42">
            <span>StreamLoaders</span>
        </a>

        <section class="telegram-offer-card" aria-labelledby="offerTitle">
            <div class="telegram-offer-icon" aria-hidden="true">✦</div>
            <p class="telegram-offer-kicker">Depuis Telegram</p>
            <h1 id="offerTitle">Bienvenue sur StreamLoaders</h1>
            <p>Découvre notre service et les nouveautés proposées par StreamLoaders.</p>

            <div class="telegram-ad-slot" id="adsterra-display-728x90" aria-label="Publicité"></div>
            <div class="telegram-ad-slot" id="container-8d98744dc408b0db5e089b7bcc209169" aria-label="Publicité"></div>

            <a class="btn-submit telegram-offer-home" href="/">Utiliser StreamLoaders</a>
        </section>
    </main>

    <div class="telegram-offer-modal-backdrop" id="offerModalBackdrop" role="presentation">
        <section class="telegram-offer-modal" role="dialog" aria-modal="true" aria-labelledby="offerModalTitle">
            <div class="telegram-offer-result-icon" id="offerResultIcon" aria-hidden="true"></div>
            <p class="telegram-offer-kicker" id="offerModalKicker">Vérification</p>
            <h2 id="offerModalTitle">Vérification en cours…</h2>
            <p id="offerModalMessage">Nous vérifions ton invitation.</p>
            <button class="btn-submit" id="offerModalClose" type="button">Continuer</button>
        </section>
    </div>

    <script type="module" src="/scripts/telegram-offer.js"></script>
</body>

</html>
